<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 뭐 먹지 룰렛</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&family=Nanum+Pen+Script&family=Black+Han+Sans&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f5f4f0;--ink:#141414;--ink2:#5c5a55;--muted:#a3a09a;--line:#e4e1da;
    --serif:'Instrument Serif',serif;--sans:'Inter','Noto Sans KR',sans-serif}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background-color:var(--bg);background-image:linear-gradient(rgba(20,20,20,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(20,20,20,.04) 1px,transparent 1px);background-size:30px 30px;background-position:-1px -1px;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}

  .page{position:relative;min-height:100vh;min-height:100svh;padding:44px 52px}

  /* header */
  .head{position:absolute;left:0;right:0;top:22px;z-index:5;text-align:center;pointer-events:none}
  h1{font-family:'Inter','Noto Sans KR',sans-serif;font-weight:300;font-size:clamp(40px,4.8vw,72px);line-height:.98;letter-spacing:-.045em;margin:0}
  h1 em{font-style:normal;font-weight:600}
  .ttl{position:relative;display:inline-block;pointer-events:auto}
  .sel{position:relative;display:inline-block;background:var(--hl);outline:1.5px solid var(--hl2);padding:0 .12em .06em;margin-top:.08em}
  .sel .d{position:absolute;width:11px;height:11px;border-radius:50%;background:var(--hl2)}
  .sel .d.a{left:-6px;top:-6px}.sel .d.b{right:-6px;bottom:-6px}
  .emo{position:absolute;right:-1.1em;bottom:.05em;font-size:.55em;line-height:1}
  .note{position:absolute;right:calc(100% + 6px);top:-6%;font-family:'Nanum Pen Script',cursive;font-size:clamp(20px,1.7vw,27px);color:#2537d0;
    transform:rotate(-9deg);white-space:nowrap;letter-spacing:0;line-height:1}
  .curl{position:absolute;left:calc(100% + 66px);top:calc(58% + 44px);width:64px;color:#2537d0}
  .stk{position:absolute;pointer-events:none;z-index:4;filter:drop-shadow(0 6px 8px rgba(0,0,0,.12))}
  .stk{line-height:1;transform:translate(-50%,-50%) rotate(var(--r));font-size:calc(var(--D)*var(--s));filter:drop-shadow(0 6px 8px rgba(0,0,0,.15))}
  .stk.in{animation:stkin .5s cubic-bezier(.2,.9,.3,1.3) both}
  @keyframes stkin{from{opacity:0;transform:translate(-50%,-50%) rotate(var(--r)) scale(.5)}}
  .handle{margin-top:10px;font-size:13px;color:var(--ink2)}
  .flt{margin-top:14px;display:flex;gap:6px;justify-content:center;align-items:center;pointer-events:auto;flex-wrap:wrap}
  .flt button{font-size:12px;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:#fbfaf7;color:var(--ink2);transition:all .2s}
  .flt button.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .flt .fn{font-size:11px;color:var(--muted);margin-left:4px}

  .nav{position:absolute;right:52px;top:52px;display:flex;gap:26px;font-size:13px;z-index:5}
  .nav button{color:var(--muted);transition:color .2s}
  .nav button:hover,.nav button.on{color:var(--ink)}
  .nav .sep{width:1px;background:var(--line)}

  /* plate */
  .table{position:absolute;left:50%;top:50%;width:var(--D);height:var(--D);transform:translate(-50%,-30%);--D:min(50vh,470px);--H:.86;--g:.16}
  .plate{position:absolute;inset:0;cursor:pointer;will-change:transform}
  .plate img{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none;user-select:none}
  .pshadow{position:absolute;inset:0;border-radius:50%;pointer-events:none;box-shadow:0 26px 44px rgba(60,55,45,.16),0 4px 10px rgba(60,55,45,.08)}
  .labels{position:absolute;inset:0}
  .lab{position:absolute;left:50%;top:50%;white-space:nowrap;font-size:clamp(11px,1.45vh,13px);font-weight:500;letter-spacing:.01em;
    padding:5px 9px;border-radius:999px;transition:background .25s,color .25s;color:var(--ink)}
  .lab.hot{color:#000}
  .lab.win{background:var(--ink);color:#fff}
  .lab.dim{opacity:.32;text-decoration:line-through}
  .lab.win.dim{opacity:1;text-decoration:none}
  .showtg{margin-bottom:18px;pointer-events:auto}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;background:#fbfaf7;padding:3px}
  .seg button{border:none;padding:6px 18px;border-radius:999px;font-size:13px;color:var(--ink2);transition:all .2s}
  .seg button.on{background:var(--ink);color:#fff}

  .cut{position:absolute;top:50%;height:calc(var(--D)*var(--H));transform:translateY(-50%);pointer-events:none;z-index:3;
    filter:drop-shadow(8px 12px 10px rgba(0,0,0,.14)) drop-shadow(1px 2px 2px rgba(0,0,0,.12))}
  .cut img{height:100%;width:100%;display:block;object-fit:contain}
  /* stem centres sit var(--g)·D outside the plate on each side */
  .fork{width:calc(var(--D)*var(--H)*.1286);left:calc(var(--D)*(-1*var(--g) - .5*var(--H)*.1286))}
  .knife{width:calc(var(--D)*var(--H)*.1029);left:calc(var(--D)*(1 + var(--g) - .5*var(--H)*.1029))}
  .marker{position:absolute;left:50%;top:-18px;transform:translateX(-50%);width:0;height:0;
    border-left:7px solid transparent;border-right:7px solid transparent;border-top:11px solid var(--ink);z-index:4}
  .fork img{width:100%;display:block}

  /* result + actions */
  .result{position:absolute;right:52px;bottom:48px;z-index:5;max-width:360px;text-align:right}
  .result .k{font-size:13px;color:var(--ink2)}
  .result .v{font-family:'Noto Serif KR',serif;font-weight:700;font-size:clamp(34px,4vw,52px);letter-spacing:-.03em;line-height:1.1;margin-top:6px;min-height:1.1em}
  .result .v.in{animation:rise .6s cubic-bezier(.2,.8,.2,1)}
  @keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .result .hist{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.6}

  .spin{position:absolute;left:50%;bottom:44px;transform:translateX(-50%) rotate(-2deg);z-index:5;
    background:#e0d9c8;color:var(--ink);padding:14px 38px;font-size:15px;letter-spacing:-.01em;transition:opacity .2s,transform .2s;
    clip-path:polygon(0 8%,3% 0,7% 9%,11% 2%,100% 0,97% 12%,100% 25%,96% 40%,100% 55%,97% 70%,100% 85%,98% 100%,0 100%,3% 88%,0 75%,4% 60%,0 45%,3% 30%,0 18%);
    box-shadow:inset 0 0 0 100px rgba(255,255,255,.08)}
  .spin:hover{transform:translateX(-50%) rotate(-2deg) translateY(-2px)}
  .spin:disabled{opacity:.3;cursor:default}

  .tag{position:absolute;left:52px;top:calc(44px + clamp(56px,7.2vw,104px)*1.72 + 46px);font-size:13px;color:var(--muted);z-index:5}

  /* result popup */
  .pop{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;padding:24px;
    background:rgba(245,244,240,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s}
  .pop.show{opacity:1;pointer-events:auto}
  .card{background:#fff;border-radius:22px;padding:44px 52px 34px;text-align:center;min-width:min(340px,100%);
    box-shadow:0 30px 70px rgba(40,35,25,.16),0 2px 6px rgba(40,35,25,.06);transform:translateY(14px) scale(.96);transition:transform .45s cubic-bezier(.2,.9,.3,1.2)}
  .pop.show .card{transform:none}
  .card .k{font-size:13px;color:var(--ink2);letter-spacing:.02em}
  .card .ico{font-size:52px;line-height:1;margin-bottom:10px;display:inline-block;animation:bob 2.4s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-4px) rotate(-4deg)}}
  .card .v{font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-weight:400;font-size:clamp(46px,8vw,72px);letter-spacing:-.01em;line-height:1.05;margin:14px 0 8px;word-break:keep-all}
  .fx{position:fixed;inset:0;pointer-events:none;z-index:31;overflow:hidden}
  .pt{position:absolute;left:50%;top:46%;width:var(--w);height:var(--h);background:var(--c);border-radius:var(--br);opacity:0;
    animation:pt var(--t) cubic-bezier(.15,.7,.35,1) var(--d) forwards}
  .pt.e{background:none;width:auto;height:auto;font-size:var(--w)}
  @keyframes pt{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}
    60%{opacity:1}
    100%{opacity:0;transform:translate(-50%,-50%) translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1)}}
  .card .h{font-size:12px;color:var(--muted);min-height:1.2em}
.card .meta{font-size:13px;color:var(--ink2);margin-top:4px;min-height:1.2em}
  .card .maps{margin-top:14px;font-size:13px;display:flex;gap:8px;justify-content:center;align-items:center}
  .card .maps span{color:var(--muted)}
  .card .maplink{display:inline-block;font-size:13px;color:#2537d0;text-decoration:underline;text-underline-offset:3px}
  .card .btns{display:flex;gap:8px;justify-content:center;margin-top:28px}
  .card .btns button{font-size:13px;padding:12px 22px;border-radius:999px;border:1px solid var(--line)}
  .card .btns .pri{background:var(--ink);border-color:var(--ink);color:#fff}

  /* log */
  .card.log{position:relative;text-align:left;width:min(420px,100%);padding:30px 30px 22px;max-height:86vh;overflow:auto}
  .log .lx{position:absolute;right:18px;top:16px;font-size:16px;color:var(--muted)}
  .log .lt{margin-bottom:18px}
  .log h3{font-family:'Inter','Noto Sans KR',sans-serif;font-weight:300;font-size:40px;letter-spacing:-.04em;margin:0;line-height:1}
  .log h3 b{font-weight:600}
  .log .lsum{font-size:14px;color:var(--ink2);margin:10px 0 22px;line-height:1.5}
  .log .lsum em{font-style:normal;font-family:'Black Han Sans','Noto Sans KR',sans-serif;font-size:18px;color:var(--ink);background:var(--hl);padding:0 6px}
  .lbars .row{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;margin-bottom:10px;font-size:14px}
  .lbars .rk{font-size:12px;color:var(--muted);text-align:right}
  .lbars .nm small{color:var(--muted);font-size:12px;margin-left:6px}
  .lbars .bar{grid-column:2/3;height:8px;border-radius:99px;background:var(--hl);margin-top:5px;transform-origin:left;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}
  .lbars .row:first-child .bar{background:var(--hl2)}
  @keyframes grow{from{transform:scaleX(0)}}
  .lbars .ct{font-size:13px;font-weight:600;align-self:start}
  .lrec{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);font-size:13px;color:var(--ink2);line-height:1.9}
  .lrec span{color:var(--muted);display:inline-block;width:44px}
  .lempty{font-size:14px;color:var(--muted);padding:24px 0;text-align:center;line-height:1.7}
  .lreset{margin-top:14px;font-size:12px;color:var(--muted);text-decoration:underline;text-underline-offset:3px}

  /* drawer */
  .scrim{position:fixed;inset:0;background:rgba(20,20,20,.18);opacity:0;pointer-events:none;transition:opacity .3s;z-index:20}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(380px,100vw);background:#fbfaf7;z-index:21;transform:translateX(100%);
    transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s;padding:40px 34px;display:flex;flex-direction:column}
  .open .scrim{opacity:1;pointer-events:auto}
  .open .drawer{transform:none;box-shadow:-20px 0 40px rgba(0,0,0,.06)}
  .drawer h2{font-family:var(--serif);font-weight:400;font-size:44px;letter-spacing:-.03em;margin:0;line-height:1}
  .drawer .x{position:absolute;right:28px;top:34px;font-size:13px;color:var(--ink2)}
  .cats{display:flex;flex-wrap:wrap;gap:8px;margin:26px 0 18px}
  .cat{font-size:13px;padding:7px 14px;border:1px solid var(--line);border-radius:999px;color:var(--ink2)}
  .cat.on{background:var(--ink);border-color:var(--ink);color:#fff}
  .add{display:flex;border-bottom:1px solid var(--ink);margin-bottom:8px}
  .add input{flex:1;min-width:0;border:none;background:none;font:inherit;font-size:15px;padding:12px 0;outline:none}
  .add input.sub{flex:.9;border-left:1px solid var(--line);padding-left:10px;margin-left:8px;font-size:14px}
  .items li .mn{color:var(--muted);font-size:13px;margin-left:8px}
  .add button{font-size:13px}
  .items{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
  .items li{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:15px}
  .items li button{font-size:12px;color:var(--muted)}
  .items li button:hover{color:var(--ink)}
  .dfoot{display:flex;justify-content:space-between;margin-top:16px;font-size:12px;color:var(--muted)}
  .dfoot button{text-decoration:underline;text-underline-offset:3px;color:var(--ink2)}

  @media (max-width:760px){
    .page{min-height:100svh;padding:18px 18px calc(110px + env(safe-area-inset-bottom));display:flex;flex-direction:column;overflow:hidden}
    .head,.nav,.result,.spin,.tag,.table{position:relative;left:auto;right:auto;top:auto;bottom:auto;transform:none}
    .nav{order:0;align-self:stretch;display:flex;align-items:center;gap:4px;font-size:13px;margin:0}
    .nav [data-mode]{padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:#fbfaf7}
    .nav [data-mode].on{background:var(--ink);border-color:var(--ink);color:#fff}
    .nav .sep{display:none}
    .nav #openLog{margin-left:auto;color:var(--ink2);text-decoration:underline;text-underline-offset:3px;margin-right:12px}
    .nav #openEdit{color:var(--ink2);text-decoration:underline;text-underline-offset:3px}
    .card.log{padding:26px 20px 18px}
    .head{order:1;margin-top:20px;text-align:center}
    .showtg{margin-bottom:46px}
    h1{font-size:clamp(40px,12vw,52px)}
    .note{display:block;right:calc(100% - 40px);top:-28px;font-size:21px}
    .emo{right:-1.05em}
    .table{order:2;--D:min(78vw,360px);--H:.7;--g:.05;margin:46px auto 0}
    .lab{font-size:10.5px;padding:2px 5px}
    .spin{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translateX(-50%) rotate(-2deg);z-index:15;padding:17px 48px;font-size:16px}
    .spin:hover{transform:translateX(-50%) rotate(-2deg)}
    .card{width:100%;padding:34px 22px 22px}
    .card .ico{font-size:44px}
    .card .btns button{flex:1;padding:14px 0}
    .drawer{width:100vw;padding:30px 22px calc(24px + env(safe-area-inset-bottom))}
  }
</style>
</head>
<body>
<div class="page" id="app">
  <div class="head">
    <div class="showtg"><span class="seg"><button type="button" data-show="shop">가게</button><button type="button" data-show="menu">메뉴</button></span></div>
    <h1 id="title"></h1>
    <div class="handle" id="handle">@signature.tower</div>
    <div class="flt"><button type="button" data-f="near">🚶 걸어서 5분 이내</button><button type="button" data-f="fresh">↺ 최근 3번 빼기</button><span class="fn" id="fltNote"></span></div>
  </div>

  <nav class="nav">
    <button data-mode="lunch">Lunch</button>
    <button data-mode="cafe">Café</button>
    <span class="sep"></span>
    <button id="openLog">Log</button>
    <button id="openEdit">Edit menu</button>
  </nav>

  <div class="table" id="table">
    <div class="pshadow"></div>
    <div class="plate" id="plate" role="button" aria-label="접시 돌리기">
      <img src="plate2.webp" alt="">
      <div class="labels" id="labels"></div>
    </div>
    <div class="cut fork"><img src="fork_plain.webp" alt=""></div>
    <div class="cut knife"><img src="knife_plain.webp" alt=""></div>
    <div class="marker"></div>
    <div id="stks" aria-hidden="true"></div>
  </div>

  <button class="spin" id="spin">Let’s spin →</button>

  <div class="result" hidden>
    <div class="k" id="rk">오늘의 메뉴</div>
    <div class="v" id="rv">—</div>
    <div class="hist" id="hist"></div>
  </div>

  <div class="tag" id="tag" hidden>고민은 접시에게 맡기세요</div>

  <div class="pop" id="pop" role="dialog" aria-modal="true" aria-labelledby="pv">
    <div class="card">
      <div class="ico" id="pico">🍽️</div>
      <div class="k" id="pk">오늘의 점심</div>
      <div class="v" id="pv"></div>
      <div class="h" id="ph"></div>
      <div class="meta" id="pmeta"></div>
      <div class="maps">📍 <a class="maplink" id="pmap" href="#" target="_blank" rel="noopener">네이버지도</a><span>·</span><a class="maplink" id="gmap" href="#" target="_blank" rel="noopener">구글지도</a></div>
      <div class="btns"><button type="button" id="again">다시 돌리기</button><button type="button" class="pri" id="ok">좋아요</button></div>
    </div>
  </div>
  <div class="pop" id="logPop" role="dialog" aria-modal="true" aria-labelledby="logTitle">
    <div class="card log">
      <button type="button" class="lx" id="logClose" aria-label="닫기">✕</button>
      <div class="seg lt"><button type="button" data-range="month">이번 달</button><button type="button" data-range="all">전체</button></div>
      <h3 id="logTitle"></h3>
      <div class="lsum" id="logSum"></div>
      <div class="lbars" id="logBars"></div>
      <div class="lrec" id="logRec"></div>
      <button type="button" class="lreset" id="logReset">기록 지우기</button>
    </div>
  </div>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" aria-label="메뉴 편집">
    <button class="x" id="closeEdit">Close</button>
    <h2 id="dtitle">Menu</h2>
    <div class="cats" id="cats"></div>
    <form class="add" id="addForm"><input id="newMenu" placeholder="메뉴 (예: 샌드위치)" maxlength="12" autocomplete="off"><input id="newItem" class="sub" placeholder="가게 (선택)" maxlength="12" autocomplete="off"><button type="submit">Add</button></form>
    <ul class="items" id="items"></ul>
    <div class="dfoot"><span id="cnt"></span><button id="reset" type="button">기본값으로</button></div>
  </aside>
</div>

<script>
const MODES = {
  lunch:{ title:"What’s for", word:"Lunch?", note:"오늘 뭐 먹지?", stk:[["🍜",93,-7,12,.12],["🍣",4,6,-18,.095],["🥟",14,99,-10,.09],["🍔",92,90,12,.095]], hl:"#c6e7d8", hl2:"#1d7a56", handle:"@signature.tower", rk:"오늘의 점심", tag:"고민은 접시에게 맡기세요",
    presets:{
      "전체":["소반","능동미나리","용대리해장국","사랑방칼국수","을지로왕순대","가야성","창화루","남강","지유켄","멘츠루","콘부","명인돈까스","바스버거","세븐패티버거"],
      "한식":["소반","능동미나리","용대리해장국","사랑방칼국수","을지로왕순대","전통맛집"],
      "중식":["가야성","창화루","남강","지유켄","바오차이"],
      "일식":["멘츠루","콘부","명인돈까스"],
      "양식":["바스버거","세븐패티버거","지금여기가맨앞"]
    }},
  cafe:{ title:"Which", word:"Café?", note:"어디 갈까?", stk:[["☕️",93,2,10,.12],["🥐",3,6,-18,.1],["🍪",-2,82,-12,.085],["🍰",90,90,10,.09]], hl:"#ddd6fb", hl2:"#6a54df", handle:"@signature.tower", rk:"오늘의 카페", tag:"시그니처타워 근처",
    presets:{
      "시그니처타워 근처":["사이드바이사이드","포비","코르코바도","DPRT커피","아마추어작업실","공간갑","크래킹커피","을지빈","베로나","맥컬리커피","커피한약방","번트서울"],

function applyShared(m, data){
  if(!data || !Array.isArray(data.items)) return;
  const items = data.items.filter(x=>typeof x==="string" && x.trim()).map(x=>x.slice(0,12)).slice(0,40);
  if(items.length < 2) return;
  if(spinning && m===S.mode){ pending[m] = {cat:data.cat, items, menus:data.menus}; return; }
  S[m].items = items; if(typeof data.cat==="string") S[m].cat = data.cat;
  if(data.menus && typeof data.menus==="object"){ const mm={}; for(const k in data.menus){ if(typeof data.menus[k]==="string") mm[String(k).slice(0,12)] = data.menus[k].slice(0,12); } S[m].menus = mm; }
  if(m===S.mode){ winner=-1; buildLabels(); renderDrawer(); }
  save();
}
function applyEditGate(){
  const ok = !db || canWrite !== false;
  $("openEdit").hidden = !ok; document.querySelector(".nav .sep").hidden = !ok;
  if(!ok) $("app").classList.remove("open");
}
(async ()=>{
  try{
    if(!window.claude || !claude.use) return;
    db = await claude.use("db");
    if(!db) return;
    const user = await claude.use("user");
    try{ canWrite = user ? await user.can("data.write") : null; }catch(_){ canWrite = null; }
    // shared menu replaces what this browser had saved
    for(const m in MODES){ const c0 = Object.keys(MODES[m].presets)[0]; S[m].cat = c0; S[m].items = [...MODES[m].presets[c0]]; }
    buildLabels(); renderDrawer(); applyEditGate();
    for(const m in MODES){
      db.doc("menus/"+m).onSnapshot(snap=>{ if(snap.exists) applyShared(m, snap.data()); }, ()=>{});
    }
  }catch(e){}
})();
$("addForm").onsubmit = e=>{ e.preventDefault(); const shop=$("newItem").value.trim(), mn=$("newMenu").value.trim(); $("newItem").value=""; $("newMenu").value="";
  const v = shop || mn;   // 가게 없이 메뉴만 넣으면 메뉴 자체가 후보가 돼요
  if(!v || spinning) return; if(!shop){ cur().items.includes(v) || cur().items.push(v); changed(); $("newMenu").focus(); return; } if(mn){ cur().menus = Object.assign({}, cur().menus, {[v]:mn}); }
  if(!cur().items.includes(v)) cur().items.push(v); changed(); $("newMenu").focus(); };
$("reset").onclick = ()=>{ if(spinning) return; const M=MODES[S.mode]; cur().cat=Object.keys(M.presets)[0]; cur().items=[...M.presets[cur().cat]]; changed(); };
$("openEdit").onclick = ()=> $("app").classList.add("open");
$("closeEdit").onclick = $("scrim").onclick = ()=> $("app").classList.remove("open");

/* ---------- init ---------- */
$("spin").onclick = spin;
document.querySelectorAll(".flt [data-f]").forEach(b=> b.onclick = ()=>{ if(spinning) return; S.filters[b.dataset.f] = !S.filters[b.dataset.f]; winner=-1; buildLabels(); save(); });
$("ok").onclick = ()=>{ if(lastPick){ logPick(lastPick); lastPick = null; } hidePop(); };
$("openLog").onclick = openLog; $("logClose").onclick = closeLog;
$("logPop").addEventListener("click", e=>{ if(e.target.id==="logPop") closeLog(); });
document.querySelectorAll("[data-range]").forEach(b=> b.onclick = ()=>{ logRange = b.dataset.range; renderLog(); });
$("logReset").onclick = ()=>{ const b = $("logReset"); if(b.dataset.armed){ cur().log = []; save(); renderLog(); b.textContent = "기록 지우기"; delete b.dataset.armed; }
  else { b.dataset.armed = 1; b.textContent = "한 번 더 누르면 지워져요"; setTimeout(()=>{ if(b.dataset.armed){ delete b.dataset.armed; b.textContent = "기록 지우기"; } }, 3000); } };
$("again").onclick = ()=>{ hidePop(); setTimeout(spin, 250); };
$("pop").addEventListener("click", e=>{ if(e.target.id==="pop") hidePop(); });
$("plate").onclick = spin;
document.addEventListener("keydown", e=>{ if(e.code==="Space" && !e.target.closest("input,button") && !$("pop").classList.contains("show")){ e.preventDefault(); spin(); }
  if(e.key==="Escape"){ $("app").classList.remove("open"); hidePop(); closeLog(); } });
// desktop: fit the plate in the space between the header (filters) and the spin button, so nothing overlaps
function fitTable(){
  const t = $("table");
  if(matchMedia("(max-width:760px)").matches){ t.style.removeProperty("--D"); t.style.top=""; t.style.transform=""; return; }
  const headB = document.querySelector(".head").getBoundingClientRect().bottom;
  const spinT = $("spin").getBoundingClientRect().top;
  const top = headB + 40, bottom = spinT - 36;           // 40px leaves room for the ▼ marker
  const D = Math.max(220, Math.min(500, bottom - top, innerWidth*0.42));
  t.style.setProperty("--D", D + "px");
  t.style.top = (top + Math.max(0, (bottom - top - D)/2)) + "px";
  t.style.transform = "translate(-50%,0)";
}
addEventListener("resize", ()=>{ fitTable(); ang = []; layout(); });
setMode(S.mode);
fitTable(); ang = []; layout();
if(document.fonts) document.fonts.ready.then(()=>{ fitTable(); ang=[]; layout(); });
</script>
